# duvet configuration — see docs/requirements/README.md
# Schema reference: https://awslabs.github.io/duvet/config.html
'$schema' = "https://awslabs.github.io/duvet/config/v0.4.0.json"

# All Go sources. Test files are matched by this same glob, so tests mark
# themselves with an explicit `//= type=test` line (a second [[source]] with
# `type = "test"` would scan _test.go files twice, once as implementation).
[[source]]
pattern = "cmd/**/*.go"

[[source]]
pattern = "internal/**/*.go"

[[source]]
pattern = "pkg/**/*.go"

# The Fleet Manifests (12-cluster-fleet.md) are not Go. YAML and the Host
# Agent's configuration files take `#` comments, so they cite requirements
# with `#=` and `#/`.
#
# duvet reads every path a pattern matches and fails on a directory, so the
# patterns below name files only, by extension.
[[source]]
pattern = "deploy/**/*.yaml"
comment-style = { meta = "#=", content = "#/" }

[[source]]
pattern = "deploy/host-agent/config/*.conf"
comment-style = { meta = "#=", content = "#/" }

# The Guest Image (13-guest-image.md): its Containerfiles, scripts and
# systemd-networkd files, all with `#` comments. By file, not by directory,
# for the reason above.
[[source]]
pattern = "guest/*.sh"
comment-style = { meta = "#=", content = "#/" }

[[source]]
pattern = "guest/*/Containerfile"
comment-style = { meta = "#=", content = "#/" }

[[source]]
pattern = "guest/*/*.sh"
comment-style = { meta = "#=", content = "#/" }

[[source]]
pattern = "guest/rootfs/network/*.network"
comment-style = { meta = "#=", content = "#/" }

# The Release (12-cluster-fleet.md#cluster-release): the goreleaser
# configuration and the release scripts beside the flr image's Containerfile.
# Only the scripts and the Containerfile, not the testdata.
[[source]]
pattern = ".goreleaser.yaml"
comment-style = { meta = "#=", content = "#/" }

[[source]]
pattern = "hack/release/*.sh"
comment-style = { meta = "#=", content = "#/" }

[[source]]
pattern = "hack/release/*.Containerfile"
comment-style = { meta = "#=", content = "#/" }

