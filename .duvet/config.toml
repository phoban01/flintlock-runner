# duvet configuration — see docs/requirements/README.md
# Schema reference: https://awslabs.github.io/duvet/config.html
'$schema' = "https://awslabs.github.io/duvet/config/v0.4.0.json"

# All Go sources. Test files are matched by this same glob, so tests mark
# themselves with an explicit `//= type=test` line (a second [[source]] with
# `type = "test"` would scan _test.go files twice, once as implementation).
[[source]]
pattern = "cmd/**/*.go"

[[source]]
pattern = "internal/**/*.go"

[[source]]
pattern = "pkg/**/*.go"

# The Host Image (11-host-image.md) and the Fleet Manifests
# (12-cluster-fleet.md) are not Go. Containerfiles, systemd units, shell and
# YAML all take `#` comments, so they cite requirements with `#=` and `#/`.
#
# duvet reads every path a pattern matches and fails on a directory, and
# `image/**/*` matches the directories under image/ too. The patterns below
# therefore name files only: by extension where directory names carry dots
# (tmpfiles.d, kubelet.service.d), by directory elsewhere.
[[source]]
pattern = "image/Containerfile"
comment-style = { meta = "#=", content = "#/" }

[[source]]
pattern = "image/*.*"
comment-style = { meta = "#=", content = "#/" }

[[source]]
pattern = "image/build/*"
comment-style = { meta = "#=", content = "#/" }

[[source]]
pattern = "image/selinux/*"
comment-style = { meta = "#=", content = "#/" }

[[source]]
pattern = "image/rootfs/usr/libexec/flr/*"
comment-style = { meta = "#=", content = "#/" }

[[source]]
pattern = "image/rootfs/usr/share/flr/*"
comment-style = { meta = "#=", content = "#/" }

[[source]]
pattern = "image/rootfs/usr/lib/**/*.service"
comment-style = { meta = "#=", content = "#/" }

[[source]]
pattern = "image/rootfs/usr/lib/**/*.conf"
comment-style = { meta = "#=", content = "#/" }

[[source]]
pattern = "image/rootfs/etc/**/*.toml"
comment-style = { meta = "#=", content = "#/" }

[[source]]
pattern = "image/rootfs/etc/**/*.cfg"
comment-style = { meta = "#=", content = "#/" }

[[source]]
pattern = "deploy/**/*.yaml"
comment-style = { meta = "#=", content = "#/" }

# The Release (12-cluster-fleet.md#cluster-release): the goreleaser
# configuration and the release scripts beside the flr image's Containerfile.
# Only the scripts and the Containerfile, not the testdata.
[[source]]
pattern = ".goreleaser.yaml"
comment-style = { meta = "#=", content = "#/" }

[[source]]
pattern = "hack/release/*.sh"
comment-style = { meta = "#=", content = "#/" }

[[source]]
pattern = "hack/release/*.Containerfile"
comment-style = { meta = "#=", content = "#/" }

[[specification]]
source = "docs/requirements/01-gitlab-protocol.md"
format = "markdown"

[[specification]]
source = "docs/requirements/02-executor.md"
format = "markdown"

[[specification]]
source = "docs/requirements/03-scheduler.md"
format = "markdown"

[[specification]]
source = "docs/requirements/04-pool-manager.md"
format = "markdown"

[[specification]]
source = "docs/requirements/05-hosts.md"
format = "markdown"

[[specification]]
source = "docs/requirements/06-fleet.md"
format = "markdown"

[[specification]]
source = "docs/requirements/07-configuration.md"
format = "markdown"

[[specification]]
source = "docs/requirements/08-observability.md"
format = "markdown"

[[specification]]
source = "docs/requirements/09-security.md"
format = "markdown"

[[specification]]
source = "docs/requirements/10-test-doubles.md"
format = "markdown"

[[specification]]
source = "docs/requirements/11-host-image.md"
format = "markdown"

[[specification]]
source = "docs/requirements/12-cluster-fleet.md"
format = "markdown"

[report.html]
enabled = true
path = ".duvet/reports/report.html"
blob-link = "${{ DUVET_BLOB_LINK || 'https://github.com/phoban01/flintlock-runner/blob/main' }}"
issue-link = "${{ DUVET_ISSUE_LINK || 'https://github.com/phoban01/flintlock-runner/issues' }}"

[report.json]
enabled = true
path = ".duvet/reports/report.json"

# The snapshot is committed. `duvet report --ci` fails when coverage changes
# without the snapshot being regenerated, which keeps requirement coverage
# from regressing silently.
[report.snapshot]
enabled = true
path = ".duvet/snapshot.txt"
