name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GOTOOLCHAIN: auto
  GOLANGCI_LINT_VERSION: v2.13.2
  DUVET_VERSION: 0.4.3

jobs:
  go:
    name: build, vet, test, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...
      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0 (commit)
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  requirements:
    name: duvet report and coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # awslabs/duvet ships a composite action that installs the crate at a
      # given version; pinned to a commit on main, version 0.4.3 (crates.io).
      - name: install duvet
        uses: awslabs/duvet@44f43e87683ae6077c64f4aa8fd519910c981fb6 # main, 2026-08-26
        with:
          version: ${{ env.DUVET_VERSION }}
      - name: duvet report
        run: make duvet
      - name: upload report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: duvet-report
          path: |
            .duvet/reports/report.html
            .duvet/reports/report.json
          if-no-files-found: error
      - name: coverage gate over the IDs the PR owns
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          ids=$(printf '%s\n' "$PR_BODY" | tr -d '\r' | sed -n 's/^Owns:[[:space:]]*//p' | tr ',' ' ' | xargs || true)
          if [ -z "$ids" ]; then
            echo "::error::PR body has no 'Owns:' line; list the requirement IDs this PR claims (docs/PLAN.md)"
            exit 1
          fi
          echo "gating on: $ids"
          # shellcheck disable=SC2086
          SKIP_REPORT=1 hack/duvet-coverage.sh $ids
