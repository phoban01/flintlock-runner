name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GOTOOLCHAIN: auto
  GOLANGCI_LINT_VERSION: v2.13.2
  DUVET_VERSION: 0.4.3

jobs:
  go:
    name: build, vet, test, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      # KF-121: the Kubernetes pool backend is tested against a real
      # kube-apiserver and etcd. The tests skip without them on a developer's
      # machine; here they are downloaded and required, so CI never skips.
      - name: envtest binaries
        run: |
          assets=$(make -s envtest)
          test -x "$assets/kube-apiserver"
          echo "KUBEBUILDER_ASSETS=$assets" >> "$GITHUB_ENV"
      - name: go test
        env:
          FLINTLOCK_RUNNER_REQUIRE_ENVTEST: "1"
        run: go test -race ./...
      # TD-043: every rendered provisioning script passes bash -n and
      # shellcheck; the test fails rather than skips when shellcheck is absent.
      - name: provisioning scripts pass bash -n and shellcheck
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; }
          shellcheck --version
          FLINTLOCK_RUNNER_REQUIRE_SHELLCHECK=1 go test -count=1 -run TestScriptsLint ./internal/fleet/scripts/
      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0 (commit)
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  # The end-to-end harness (TD-050): the real flr binary against
  # the fake GitLab, the fake Pool Manager and fake Hosts, on a runner with no
  # KVM. The hardware tier (TD-052) is skipped here because no hardware
  # Inventory is named.
  e2e:
    name: end-to-end harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: make e2e
        run: make e2e E2E_FLAGS=-v

  requirements:
    name: duvet report and coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # the snapshot guard below diffs against the base branch
          fetch-depth: 0
      # The snapshot records every requirement's status. CONTRIBUTING reserves
      # it for the lead at milestones, so that parallel work-package branches
      # do not all conflict on it.
      - name: snapshot is the lead's to change
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.base_ref }}
        run: |
          if git diff --quiet "origin/$BASE...HEAD" -- .duvet/snapshot.txt; then
            exit 0
          fi
          if printf '%s\n' "$PR_BODY" | tr -d '\r' | grep -q '^Snapshot: milestone'; then
            echo "snapshot change accepted: the PR body declares a milestone snapshot"
            exit 0
          fi
          echo "::error::this PR changes .duvet/snapshot.txt, which CONTRIBUTING reserves for the lead at milestones. Restore it with: git checkout origin/$BASE -- .duvet/snapshot.txt. A deliberate milestone snapshot must say 'Snapshot: milestone' on its own line in the PR body."
          exit 1
      # awslabs/duvet ships a composite action that installs the crate at a
      # given version; pinned to a commit on main, version 0.4.3 (crates.io).
      - name: install duvet
        uses: awslabs/duvet@44f43e87683ae6077c64f4aa8fd519910c981fb6 # main, 2026-08-26
        with:
          version: ${{ env.DUVET_VERSION }}
      - name: duvet report
        run: make duvet
      - name: upload report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: duvet-report
          path: |
            .duvet/reports/report.html
            .duvet/reports/report.json
          if-no-files-found: error
      - name: coverage gate over the IDs the PR owns
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          ids=$(printf '%s\n' "$PR_BODY" | tr -d '\r' | sed -n 's/^Owns:[[:space:]]*//p' | tr ',' ' ' | xargs || true)
          if [ -z "$ids" ]; then
            echo "::error::PR body has no 'Owns:' line; list the requirement IDs this PR claims (docs/PLAN.md). A PR that implements no requirement, such as a tooling or CI change, says 'Owns: none'."
            exit 1
          fi
          if [ "$ids" = "none" ]; then
            echo "no requirement IDs claimed; skipping the coverage gate"
            exit 0
          fi
          echo "gating on: $ids"
          # shellcheck disable=SC2086
          SKIP_REPORT=1 hack/duvet-coverage.sh $ids

  # The Host Image (docs/requirements/11-host-image.md): lint its sources,
  # build it for x86_64 with podman, which runs the check stage of HI-008
  # inside the built image, then check its OCI labels. The runner has no
  # /dev/kvm access configured and no AWS credentials, which is HI-007. The
  # build is slow, so it runs only when the image or this workflow changed.
  image:
    name: host image build and check stage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: did the image change
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="origin/$BASE...HEAD"
          elif git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..HEAD"
          else
            range=""
          fi
          if [ -z "$range" ] || git diff --name-only "$range" | grep -qE '^(image/|\.github/workflows/ci\.yml$)'; then
            echo "build=true" >>"$GITHUB_OUTPUT"
          else
            echo "image/ is unchanged in $range; skipping the build"
            echo "build=false" >>"$GITHUB_OUTPUT"
          fi
      - name: lint the image sources
        if: steps.changed.outputs.build == 'true'
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; }
          FLINTLOCK_RUNNER_REQUIRE_SHELLCHECK=1 make image-lint
      - name: build the image, check stage included
        if: steps.changed.outputs.build == 'true'
        run: |
          podman --version
          make image CONTAINER_ENGINE=podman
      - name: run the checks again and compare the labels
        if: steps.changed.outputs.build == 'true'
        run: make image-check CONTAINER_ENGINE=podman
