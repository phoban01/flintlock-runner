# golangci-lint v2 configuration. Run with `make lint`; CI pins the same
# version through GOLANGCI_LINT_VERSION in the Makefile and ci.yml.
version: "2"

run:
  timeout: 10m
  tests: true

linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - misspell
    - nolintlint
    - revive
    - unconvert
    - unparam
  settings:
    gocritic:
      disabled-checks:
        # duvet annotations are written as `//=` and `//#` by design
        # (docs/requirements/README.md); there is no space to put there.
        - commentFormatting
    revive:
      rules:
        - name: exported
          arguments: ["checkPrivateReceivers"]
        - name: package-comments
  exclusions:
    generated: lax
    presets:
      - common-false-positives
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/phoban01/flintlock-runner
