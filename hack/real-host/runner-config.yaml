# The Runner's configuration for a run on a real Host (README.md). run.sh
# puts it in place of deploy/runner/config.yaml, and writes the Guest Image
# references in place of KERNEL_IMAGE and ROOTFS_IMAGE. It differs from
# deploy/runner/config.yaml in three ways:
#
#   - GitLab is the fake GitLab in the cluster, over plain HTTP.
#   - The only Profile is real-host-arm64, and it is the default: the run
#     has one arm64 Host, so no Host could fill an amd64 Pool.
#   - The Guest Image is by digest, from a release's images.txt or from
#     the Host's own registry (GUEST in run.sh).
#
# The Host Services are on, as in deploy/runner/config.yaml.
#
# The one value in double quotes is the job timeout, as in
# deploy/runner/config.yaml; keep it the only one.
gitlab:
  url: http://fake-gitlab.flintlock-system:8080
  allow_insecure: true
  name: flintlock-runner
  concurrent: 1
  check_interval: 3s
  shutdown_timeout: "10800s"

pool_manager:
  backend: claim
  claim:
    holder_service_account: flintlock-runner-holder
    serving_ca:
      namespace: battery-operator-system
      name: flintlockd-ca
      key: serving-ca.crt

profiles:
  # As deploy/runner/config.yaml's lima-arm64: one MicroVM at a time. The
  # Host has 4 vCPUs and 8 GiB, and keeps 2 vCPUs and 4 GiB for itself.
  - name: real-host-arm64
    default: true
    arch: arm64
    vcpu: 2
    memory_mb: 2048
    images: [flr-arm64]
    kernel:
      image: KERNEL_IMAGE
      filename: boot/vmlinux
    rootfs: ROOTFS_IMAGE
    pool:
      size: 1

host_services:
  buildkit:
    port: 1234
  go_proxy:
    port: 3000
  registry_mirror:
    port: 5000
  http_cache:
    port: 3128

observability:
  listen_address: :9252

state_dir: /var/lib/flintlock-runner
