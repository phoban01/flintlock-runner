# A stand-in for deploy/, for test-render.sh only: a kustomization that
# names the flr image by its source tag, as deploy/ does, and a Runner
# configuration that names the Guest Image by the placeholder tag REPLACE,
# as deploy/runner/config.yaml does.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - runner.yaml
configMapGenerator:
  - name: runner-config
    files:
      - config.yaml
