apiVersion: apps/v1
kind: Deployment
metadata:
  name: flr
  annotations:
    gitlab-runner.flintlock.dev/runner-image: ghcr.io/phoban01/flintlock-runner/flr:dev
spec:
  selector:
    matchLabels: {app: flr}
  template:
    metadata:
      labels: {app: flr}
    spec:
      containers:
        - name: flr
          image: ghcr.io/phoban01/flintlock-runner/flr:dev
