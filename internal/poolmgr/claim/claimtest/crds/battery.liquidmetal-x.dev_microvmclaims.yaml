---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: microvmclaims.battery.liquidmetal-x.dev
spec:
  group: battery.liquidmetal-x.dev
  names:
    kind: MicroVMClaim
    listKind: MicroVMClaimList
    plural: microvmclaims
    singular: microvmclaim
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.poolRef.name
      name: Pool
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.host.nodeName
      name: Node
      type: string
    - jsonPath: .status.leaseExpiresAt
      name: Expires
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          MicroVMClaim is one consumer's hold on one warm MicroVM from a Pool:
          battery's ClaimVM, Heartbeat and ReleaseVM as a resource. Creating it
          claims a MicroVM, patching spec.renewTime renews the Lease, and deleting it
          releases the MicroVM.

          The proposal on battery#46 made the claim's name its lease id. battery
          v0.3.3 chooses the lease id itself in ClaimVM, so the id is recorded in
          status.leaseID instead (ADR 0001, consequence 2).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec is the claim the consumer makes.
            properties:
              poolRef:
                description: |-
                  poolRef names the Pool, in the claim's namespace, to claim a MicroVM
                  from. It is immutable.
                properties:
                  name:
                    description: name is the name of the Pool.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
                x-kubernetes-validations:
                - message: spec.poolRef is immutable
                  rule: self == oldSelf
              renewTime:
                description: |-
                  renewTime is the last time the Holder renewed the claim's Lease. The
                  Holder patches it, as the holder of a coordination.k8s.io Lease does,
                  and the Claim Controller turns each change into a battery Heartbeat.
                format: date-time
                type: string
              serviceAccountName:
                description: |-
                  serviceAccountName names the ServiceAccount, in the claim's namespace,
                  that may use the claimed MicroVM: the Holder. It is immutable, so a
                  claimed MicroVM can never be handed to another account.
                maxLength: 253
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: spec.serviceAccountName is immutable
                  rule: self == oldSelf
            required:
            - poolRef
            - serviceAccountName
            type: object
          status:
            description: |-
              status is battery's answer to the claim, which only the Claim
              Controller writes.
            properties:
              boundTime:
                description: boundTime is when the claim was bound.
                format: date-time
                type: string
              conditions:
                description: |-
                  conditions hold the claim's Bound, Synced and AgentAvailable
                  conditions.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              host:
                description: host is the Host the claimed MicroVM runs on.
                properties:
                  agentAddress:
                    description: agentAddress is the host:port of the Exec Agent on
                      the Host.
                    type: string
                  nodeName:
                    description: nodeName is the name of the Host's Node.
                    type: string
                type: object
              leaseExpiresAt:
                description: |-
                  leaseExpiresAt is when the claim's Lease expires unless the Holder
                  renews it. It is battery's expiry, not one the Operator works out.
                format: date-time
                type: string
              leaseID:
                description: |-
                  leaseID is the id of the claim's Lease, which battery chose when the
                  claim was bound.
                type: string
              microVM:
                description: microVM is the claimed MicroVM.
                properties:
                  uid:
                    description: uid is the MicroVM's uid in battery and flintlock.
                    type: string
                required:
                - uid
                type: object
              observedRenewTime:
                description: |-
                  observedRenewTime is the spec.renewTime the Claim Controller last
                  relayed to battery, or the one the claim had when it was bound. While
                  spec.renewTime differs from it, the claim has a renewal the
                  controller has yet to relay. It is written with leaseExpiresAt, in
                  one write.
                format: date-time
                type: string
              phase:
                description: phase is where the claim is in its life.
                enum:
                - Pending
                - Bound
                - Expired
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
