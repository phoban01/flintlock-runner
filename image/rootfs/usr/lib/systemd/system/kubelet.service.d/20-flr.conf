#= docs/requirements/11-host-image.md#kubernetes-node
#/ The Host Image SHALL configure the kubelet to reserve all CPU
#/ and memory beyond the configured Host reserve, so that the Host's Node
#/ offers only the Host reserve to pods and the Virtual Node of KF-012 offers
#/ the rest to MicroVMs.
# Sorts after kubeadm's 10-kubeadm.conf and repeats its ExecStart with
# $FLR_KUBELET_ARGS last, so the labels and the reservation written by
# flr-kubelet-config.service win over a duplicate flag from kubeadm or from
# /etc/sysconfig/kubelet.
[Unit]
Wants=flr-kubelet-config.service flr-cache.service
After=flr-kubelet-config.service flr-cache.service containerd.service

[Service]
EnvironmentFile=-/run/flr/kubelet.env
ExecStart=
ExecStart=/usr/bin/kubelet $KUBELET_KUBECONFIG_ARGS $KUBELET_CONFIG_ARGS $KUBELET_KUBEADM_ARGS $KUBELET_EXTRA_ARGS $FLR_KUBELET_ARGS
