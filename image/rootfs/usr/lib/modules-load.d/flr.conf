#= docs/requirements/11-host-image.md#kernel-and-kvm
#/ The Host Image SHALL load the `kvm`, `vhost_vsock`,
#/ `dm_thin_pool`, `tun` and `bridge` kernel modules at boot.
kvm
vhost_vsock
dm_thin_pool
tun
bridge
# kvm alone creates no /dev/kvm; the vendor module does. Only the one that
# matches the CPU loads, and flr-kvm.service decides whether KVM is usable.
kvm_intel
kvm_amd
# For the kubelet and containerd on the Host's own Node.
overlay
br_netfilter
