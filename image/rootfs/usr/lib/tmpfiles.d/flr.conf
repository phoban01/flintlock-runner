#= docs/requirements/11-host-image.md#image-storage
#/ The Host Image SHALL create the Host Service cache directory on
#/ instance-store storage and SHALL keep all `flintlockd` and containerd
#/ state under `/var`.
# /var is empty on a fresh bootc deployment and is never touched by an
# upgrade, so everything the image needs there is created at boot.
d /run/flr 0755 root root -
d /run/flr/not-ready.d 0755 root root -
d /etc/flintlock-runner 0755 root root -
d /var/lib/flintlock 0755 root root -
d /var/lib/containerd 0711 root root -
d /var/lib/containerd/snapshotter 0711 root root -
d /var/lib/containerd/snapshotter/devmapper 0711 root root -
d /var/lib/flintlock-runner 0755 root root -
d /var/lib/flintlock-runner/cache 0755 root root -
d /var/lib/kubelet 0755 root root -
#= docs/requirements/11-host-image.md#kernel-and-kvm
#/ The Host Image SHALL label the Host environment file and the
#/ not ready reason directory it writes under `/run/flr` so that the Host
#/ Agent's containers can read them, and the Host Service cache directory so
#/ that they can write it
# systemd-tmpfiles labels what it creates from the policy's file contexts
# (selinux/flr.fc); these lines restore those labels on the paths the Host
# Agent mounts whenever tmpfiles runs and they already exist, the way
# restorecon would, without recursing and without touching mode or owner.
# host.env does not exist when tmpfiles first runs at boot, and the cache
# directory is a mount point by the time the Host Agent uses it, so
# flr-host-config and flr-cache label those two themselves as well.
z /run/flr/not-ready.d - - - -
z /run/flr/host.env - - - -
z /var/lib/flintlock-runner/cache - - - -
d /var/lib/dnsmasq 0755 root dnsmasq -
# The kubernetes-cni package installs into /opt/cni/bin, which is /var on a
# bootc host; the build moves the plugins to /usr/libexec/cni and this copies
# them back on first boot, where a CNI DaemonSet can add its own beside them.
d /var/opt/cni 0755 root root -
C /var/opt/cni/bin 0755 root root - /usr/libexec/cni
d /etc/cni/net.d 0755 root root -
