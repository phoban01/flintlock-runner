# The Runner's configuration file (docs/requirements/07-configuration.md),
# mounted from the ConfigMap flintlock-runner-config at
# /etc/flintlock-runner/config.yaml. It holds no secret: the GitLab runner
# token comes from the Secret flintlock-runner-gitlab-token through
# FLINTLOCK_RUNNER_GITLAB_TOKEN (deploy/runner/deployment.yaml).
#
# The Runner of a cluster fleet claims each MicroVM from battery-operator
# with a MicroVMClaim (12-cluster-fleet.md#battery-claims), and runs each
# Stage through the Exec Agent of the claim's Host over the agent-exec
# Guest Transport (#agent-exec-transport). battery-operator v0.5.0's
# Manifests provide the resources, battery and the Exec Agents
# (deploy/README.md).
#
# Replace what says REPLACE. A release's flintlock-runner-fleet.yaml has the
# guest image digests of that release in place of REPLACE already
# (hack/release/render-manifests.sh). The one value in double quotes is
# written by kustomize from deploy/runner/job-timeout.yaml; do not add
# other double quotes to this file, because the replacement counts them.
gitlab:
  url: https://gitlab.example.com # REPLACE with your GitLab instance
  name: flintlock-runner
  concurrent: 8
  shutdown_timeout: "10800s"

# The claim backend (KF-150 to KF-156), with the Runner's own in-cluster
# identity: no kubeconfig, and the claims, their Secrets and the Pools in
# the namespace of the Runner's pod, flintlock-system.
pool_manager:
  backend: claim
  claim:
    # Every claim names the Holder, and each claim token is a token of it
    # (deploy/runner/holder.yaml).
    holder_service_account: flintlock-runner-holder
    # The ConfigMap battery-operator writes its serving CA to, which every
    # Exec Agent is verified against (KF-186). These are battery-operator
    # v0.5.0's names, and the defaults; deploy/runner/rbac.yaml lets the
    # Runner read this one ConfigMap.
    serving_ca:
      namespace: battery-operator-system
      name: flintlockd-ca
      key: serving-ca.crt

# The Profiles (KF-080). Each names what battery's Pool of that Profile boots.
# None names a Guest Transport: under the claim backend the Executor runs
# every Profile over agent-exec (KF-185), and a Profile that names ssh is
# refused (KF-195).
#
# Each boots the Guest Image of guest/ (docs/requirements/13-guest-image.md):
# Firecracker's CI 6.1 kernel at boot/vmlinux, and one of its root
# filesystem images. guest-rootfs is Ubuntu 24.04 with the guest agent,
# bash, git, curl, the CA certificates and gitlab-runner-helper at the
# default helper path. guest-rootfs-docker adds Docker Engine and Go, and
# guest-rootfs-kind adds kind and kubectl to that (docs/docker-and-kind.md).
# Each image is one index for amd64 and arm64, so an amd64 and an arm64
# Profile name the same references. The shell, the helper path and the
# builds and cache directories are left to their defaults, which are what
# the images have.
#
# Pin the images by digest (CF-027). Each release lists the digests it
# pushed in its images.txt asset (docs/RELEASING.md), one line per image:
# the tag, then the same image by digest. The images are guest-kernel,
# guest-rootfs, guest-rootfs-docker and guest-rootfs-kind, in the
# repositories of ghcr.io/phoban01/flintlock-runner. A release writes them
# into its flintlock-runner-fleet.yaml in place of :REPLACE below. To apply
# this directory from source, replace each :REPLACE with the
# @sha256:<digest> of one release. A tag loads too, with a warning at
# startup that names the Profile and the image (CF-027), but the tag names
# whatever was pushed last under it.
profiles:
  - name: default
    default: true
    arch: amd64
    vcpu: 2
    memory_mb: 4096
    images: [flr/ubuntu]
    kernel:
      image: ghcr.io/phoban01/flintlock-runner/guest-kernel:REPLACE
      filename: boot/vmlinux
    rootfs: ghcr.io/phoban01/flintlock-runner/guest-rootfs:REPLACE
    pool:
      size: 2
  # An arm64 Profile needs arm64 Hosts. The Runner pins each Pool to its
  # Profile's architecture, so on a fleet of amd64 Hosts the Pool of an
  # arm64 Profile never becomes Ready. With arm64 Hosts, add a Profile like
  # the one below, and a Job asks for it with `image: flr/arm64`. It boots
  # the same images as the default Profile: each is one index for both.
  #
  # - name: arm64
  #   arch: arm64
  #   vcpu: 2
  #   memory_mb: 4096
  #   images: [flr/arm64]
  #   kernel:
  #     image: <the default Profile's kernel image>
  #     filename: boot/vmlinux
  #   rootfs: <the default Profile's rootfs>
  #   pool:
  #     size: 1
  # Jobs that build and run containers ask for `image: flr/docker`: Docker
  # Engine with buildx, pointed at the Host's registry mirror at boot, and
  # Go. `docker buildx build` reaches the Host's buildkitd through
  # BUILDKIT_HOST.
  - name: docker
    arch: amd64
    vcpu: 4
    memory_mb: 4096
    images: [flr/docker]
    kernel:
      image: ghcr.io/phoban01/flintlock-runner/guest-kernel:REPLACE
      filename: boot/vmlinux
    rootfs: ghcr.io/phoban01/flintlock-runner/guest-rootfs-docker:REPLACE
    pool:
      size: 1
  # Jobs that need a Kubernetes cluster ask for `image: flr/kind`: the
  # Docker image with kind and kubectl. The Job makes the cluster with
  # flr-kind-cluster, from /etc/default/kind-bootstrap and
  # /etc/kind/kind-config.yaml.
  - name: kind
    arch: amd64
    vcpu: 4
    memory_mb: 8192
    images: [flr/kind]
    kernel:
      image: ghcr.io/phoban01/flintlock-runner/guest-kernel:REPLACE
      filename: boot/vmlinux
    rootfs: ghcr.io/phoban01/flintlock-runner/guest-rootfs-kind:REPLACE
    pool:
      size: 1
  # Jobs that want a cluster at once ask for `image: flr/kind-ready`: the
  # kind image, whose Pool makes the cluster in each MicroVM before battery
  # marks it available. The Job's flr-kind-cluster finds the cluster
  # running and only writes the kubeconfig. Each warm MicroVM keeps its
  # cluster running while it waits, and battery gives the create hook no
  # time limit (docs/docker-and-kind.md).
  #
  #= docs/requirements/13-guest-image.md#guest-kind-fast
  #/ The Fleet Manifests SHALL include a Profile for the Job Image
  #/ `flr/kind-ready` that boots the kind image and whose Pool runs
  #/ `flr-kind-cluster` as its create hook.
  - name: kind-ready
    arch: amd64
    vcpu: 4
    memory_mb: 8192
    images: [flr/kind-ready]
    kernel:
      image: ghcr.io/phoban01/flintlock-runner/guest-kernel:REPLACE
      filename: boot/vmlinux
    rootfs: ghcr.io/phoban01/flintlock-runner/guest-rootfs-kind:REPLACE
    pool:
      size: 1
      create_hooks:
        - /usr/local/bin/flr-kind-cluster

# What Jobs are told about the Host Services. The addresses come from the
# annotations the Host Agent keeps on the Host's Node (KF-194, KF-189);
# these sections say which services the Executor points Jobs at, and have to
# agree with the Host Service Components enabled in deploy/kustomization.yaml
# and with the HTTP cache upstreams in
# deploy/host-agent/services/http-cache/http-cache.upstreams.
host_services:
  buildkit:
    port: 1234
  go_proxy:
    port: 3000
  # The Docker and kind images point their container tools at port 5000 of
  # the guest's gateway at boot, so keep the registry mirror there.
  registry_mirror:
    port: 5000
  http_cache:
    port: 3128

observability:
  # /metrics, /healthz and /readyz, probed by the Deployment.
  listen_address: :9252

state_dir: /var/lib/flintlock-runner
