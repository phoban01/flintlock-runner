# The Runner: its Deployment, configuration, identity and permissions, and
# the Holder its claims name. deploy/kustomization.yaml lists this
# directory, so `kustomize build deploy` renders it with the Host Agent.
#
# It needs battery-operator v0.1.0's Manifests in the cluster first: the
# Pool and MicroVMClaim resources, and the namespace battery-operator-system,
# where rbac.yaml lets the Runner read the serving CA (deploy/README.md).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - serviceaccount.yaml
  - holder.yaml
  - rbac.yaml
  - deployment.yaml
  - job-timeout.yaml

configMapGenerator:
  - name: flintlock-runner-config
    namespace: flintlock-system
    files:
      - config.yaml
    options:
      labels:
        app.kubernetes.io/name: flintlock-runner

# deploy/runner/job-timeout.yaml is the one place the job timeout is set.
# The configuration takes it whole, a Go duration, into the one double-quoted
# value of config.yaml (the second field when the file is split on double
# quotes); the pod spec takes the digits before the `s`.
replacements:
  - source:
      kind: ConfigMap
      name: flintlock-runner-job-timeout
      fieldPath: data.jobTimeout
    targets:
      - select:
          kind: ConfigMap
          name: flintlock-runner-config
        fieldPaths:
          - data.config\.yaml
        options:
          delimiter: '"'
          index: 1
  - source:
      kind: ConfigMap
      name: flintlock-runner-job-timeout
      fieldPath: data.jobTimeout
      options:
        delimiter: s
        index: 0
    targets:
      - select:
          kind: Deployment
          name: flintlock-runner
        fieldPaths:
          - spec.template.spec.terminationGracePeriodSeconds
