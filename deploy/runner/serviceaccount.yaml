# The Runner's identity. The claim backend creates MicroVMClaims and their
# Secrets as it, and requests the claim tokens of the Holder (holder.yaml)
# with it; rbac.yaml says what it may do (KF-196). The agent-exec Guest
# Transport does not present its token to an Exec Agent: each claim has a
# claim token of its own (KF-186).
#
#= docs/requirements/12-cluster-fleet.md#cluster-least-privilege
#/ The Fleet Manifests SHALL NOT grant any workload an AWS
#/ permission.
# The ServiceAccount carries no eks.amazonaws.com/role-arn or other workload
# identity annotation.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flintlock-runner
  namespace: flintlock-system
  labels:
    app.kubernetes.io/name: flintlock-runner
automountServiceAccountToken: false
