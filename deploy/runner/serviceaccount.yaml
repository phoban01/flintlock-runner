# The Runner's identity and the bindings of deploy/runner/role.yaml to it.
#
#= docs/requirements/12-cluster-fleet.md#cluster-least-privilege
#/ The Fleet Manifests SHALL NOT grant any workload an AWS
#/ permission.
# The ServiceAccount carries no eks.amazonaws.com/role-arn or other workload
# identity annotation, and no binding here names anything but the Role and
# ClusterRole of role.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flintlock-runner
  namespace: flintlock-system
  labels:
    app.kubernetes.io/name: flintlock-runner
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flintlock-runner
  namespace: flintlock-system
  labels:
    app.kubernetes.io/name: flintlock-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flintlock-runner
subjects:
  - kind: ServiceAccount
    name: flintlock-runner
    namespace: flintlock-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flintlock-runner-nodes
  labels:
    app.kubernetes.io/name: flintlock-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: flintlock-runner-nodes
subjects:
  - kind: ServiceAccount
    name: flintlock-runner
    namespace: flintlock-system
