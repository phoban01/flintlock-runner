# The Runner's identity. The agent-exec Guest Transport authenticates to
# each Exec Agent with this ServiceAccount's token (KF-186), and the claim
# backend will create MicroVMClaims as it.
#
# No permission is bound to it yet: what the Runner may do with the claim
# resource depends on battery's shapes and arrives with the claim backend,
# together with the read access to Nodes that KF-189 needs.
#
#= docs/requirements/12-cluster-fleet.md#cluster-least-privilege
#/ The Fleet Manifests SHALL NOT grant any workload an AWS
#/ permission.
# The ServiceAccount carries no eks.amazonaws.com/role-arn or other workload
# identity annotation.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flintlock-runner
  namespace: flintlock-system
  labels:
    app.kubernetes.io/name: flintlock-runner
automountServiceAccountToken: false
