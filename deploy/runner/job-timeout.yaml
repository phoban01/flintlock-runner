# THE ONE PLACE TO SET THE RUNNER'S JOB TIMEOUT: the longest a Job of this
# fleet may run.
#
# This object is never applied (local-config). deploy/runner/kustomization.yaml
# copies `jobTimeout` into two places:
#
#   - gitlab.shutdown_timeout in the Runner's configuration, how long a
#     stopping Runner lets running Jobs finish (GL-071, GL-072);
#   - terminationGracePeriodSeconds of the Runner's pod, the digits only, so
#     that the kubelet does not kill the Runner before that.
#
# Keep it in whole seconds with the `s` suffix: the configuration wants a Go
# duration and the pod spec wants the number. `make manifests-check` fails when
# the rendered grace period is shorter than the rendered job timeout (KF-081).
apiVersion: v1
kind: ConfigMap
metadata:
  name: flintlock-runner-job-timeout
  annotations:
    config.kubernetes.io/local-config: "true"
data:
  jobTimeout: 10800s
