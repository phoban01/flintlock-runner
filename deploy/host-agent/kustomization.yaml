# The Host Agent without its Host Services: the DaemonSet with the
# host-services container, which publishes where the Host Services listen,
# its identity and permissions, and the shared configuration. The Host
# Services are Components under services/, included by
# deploy/kustomization.yaml.
#
# The Exec Agent is not here: battery-operator's Manifests run it
# (deploy/README.md).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - serviceaccount.yaml
  - host-services-rbac.yaml
  - host-services-admission-policy.yaml
  - daemonset.yaml

configMapGenerator:
  - name: flintlock-host-agent-config
    namespace: flintlock-system
    files:
      - config/render.sh
      - config/prepare-cache.sh
      - config/prewarm.sh
      - config/host-services.yaml.tmpl
    options:
      labels:
        app.kubernetes.io/name: flintlock-host-agent
