# The Host configuration lines that every Host pool of a cluster fleet sets
# for the Host Services, in the host.conf of the pool's settings in
# battery-operator's Cluster API templates
# (config/capi/pools/<pool>/host-pool.yaml). Copy both lines as they are.
# deploy/README.md, "Host pools", says what else a pool sets.
#
#= docs/requirements/12-cluster-fleet.md#host-pool
#/ The Fleet Manifests SHALL provide the gateway service ports and
#/ gateway service user ids that a Host pool sets for the Host Services,
#/ listing every port a Host Service serves on and every user id a Host
#/ Service runs as.
#
# GATEWAY_SERVICE_PORTS: the TCP ports on the guest bridge gateway that the
# Host Image opens to guests (battery-operator HI-078): buildkitd 1234, the
# Go module proxy 3000, the registry mirror 5000 and the HTTP cache 3128.
#
# GATEWAY_SERVICE_UIDS: the user ids whose traffic to the metadata service
# and the Host's control ports the Host Image drops (battery-operator
# HI-080): nginx 101, buildkitd 1000, Athens 10001 and zot 10002, and
# 100000-165535, the subordinate ids of the buildkit image's user, which
# build steps run as.
#
# The Host Agent's render init container reads this file from its
# ConfigMap, and refuses to start the Host Services on a Host whose
# settings leave out any of these (KF-199). make manifests-check compares
# both lines with the ports and user ids of the manifests.
GATEWAY_SERVICE_PORTS=1234,3000,5000,3128
GATEWAY_SERVICE_UIDS=101,1000,10001,10002,100000-165535
