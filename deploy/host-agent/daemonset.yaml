# The Host Agent (docs/requirements/12-cluster-fleet.md, section "Host
# Agent"): one pod per Host with the Host Services, and the host-services
# container that publishes where they listen.
#
#= docs/requirements/12-cluster-fleet.md#cluster-host-agent
#/ The Fleet Manifests SHALL run the Host Agent as a DaemonSet that
#/ tolerates the Host taint, selects the Host label and contains the Host
#/ Services of FL-100.
#
# The Exec Agent is not in the Host Agent: battery-operator's Manifests run
# it, as a DaemonSet of their own (deploy/README.md, "The Exec Agent").
#
# This file is the plumbing every container of the Host Agent shares, and
# the host-services container. Each Host Service is a kustomize Component
# under services/, which adds its containers, its configuration templates
# and its entry in the host-services configuration;
# deploy/kustomization.yaml includes all four.
#
# Least privilege (KF-113). Nothing here is privileged, and no container
# adds a capability except the two noted where they are added: CAP_CHOWN
# for the cache preparation and CAP_SETUID/CAP_SETGID for rootless
# buildkitd. The host mounts are, each justified where it is declared:
#
#   /run/flr/host.env                    read-only, render only
#   /var/lib/flintlock-runner/cache      read-write, cache preparation and
#                                        the Host Services, each its own
#                                        subdirectory
#
# The Host Image labels both for the container domain (HI-065): the first
# container_ro_file_t, the cache container_file_t, at s0.
#
# No container of the Host Agent reaches flintlockd.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: flintlock-host-agent
  namespace: flintlock-system
  labels:
    app.kubernetes.io/name: flintlock-host-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: flintlock-host-agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flintlock-host-agent
    spec:
      # host-services-rbac.yaml and host-services-admission-policy.yaml name
      # this account in this namespace; keep both.
      serviceAccountName: flintlock-host-agent
      # The token goes to the host-services container only, through its
      # projected volume host-services-token.
      automountServiceAccountToken: false
      nodeSelector:
        gitlab-runner.flintlock.dev/host: "true"
      tolerations:
        - key: gitlab-runner.flintlock.dev/host
          operator: Equal
          value: "true"
          effect: NoSchedule
      #= docs/requirements/12-cluster-fleet.md#cluster-host-agent
      #/ The Host Agent SHALL run in the Host's network namespace and
      #/ SHALL bind every Host Service only to the guest bridge gateway address.
      # The Host's network namespace is where the guest bridge and its
      # gateway address are. Each service's configuration names the gateway
      # address, which render.sh reads from the Host Image's
      # /run/flr/host.env.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      hostPID: false
      hostIPC: false
      # Nothing to wait for beyond the services' own shutdown.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        # SELinux (HI-065). The containers keep the ordinary container
        # domain, container_t, except buildkitd, which names
        # container_engine_t and repeats this level (KF-139, in
        # services/buildkit); only the MCS level is fixed here. A pod otherwise
        # gets two random categories each time it starts, and what the Host
        # Services write into the cache directory carries them, so the next
        # Host Agent pod, with other categories, could neither read its
        # predecessor's caches nor hand them over in prepare-cache. With a
        # fixed pair every Host Agent pod reads what the last one wrote,
        # and a pod with random categories still cannot. The Host Image
        # labels the host paths below at s0, which every level dominates;
        # see "SELinux" in image/README.md.
        seLinuxOptions:
          level: "s0:c311,c827"
      initContainers:
        # Renders the host-services container's and the Host Services'
        # configuration for this Host, bridge gateway address included
        # (render.sh).
        - name: render
          image: busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
          command: [/bin/sh, /etc/flr/templates/render.sh]
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: templates
              mountPath: /etc/flr/templates
              readOnly: true
            - name: rendered
              mountPath: /etc/flr/rendered
            - name: host-env
              mountPath: /run/flr/host.env
              readOnly: true
        #= docs/requirements/12-cluster-fleet.md#cluster-host-agent
        #/ The Host Agent SHALL keep all Host Service storage in the Host
        #/ Service cache directory of HI-024, so that it outlives the pod and a
        #/ reboot of the Host.
        # Creates each enabled Host Service's directory under the cache
        # directory and hands it to that service's user id
        # (prepare-cache.sh).
        - name: prepare-cache
          image: busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
          command: [/bin/sh, /etc/flr/templates/prepare-cache.sh]
          #= docs/requirements/12-cluster-fleet.md#cluster-least-privilege
          #/ The Host Agent SHALL hold only the privileges it needs to bind
          #/ to the bridge gateway in the Host's network namespace and to write the
          #/ cache directory.
          # Root, because root owns the Host Image's cache directory, and
          # CAP_CHOWN alone, to give each service its directory. A hostPath
          # is never re-owned by the kubelet, and fsGroup does not apply to
          # it, so nothing short of this lets the non-root services write
          # there.
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [CHOWN]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: templates
              mountPath: /etc/flr/templates
              readOnly: true
            - name: cache
              mountPath: /var/lib/flintlock-runner/cache
      # The Host Service Components add their containers to this one.
      containers:
        #= docs/requirements/12-cluster-fleet.md#cluster-host-agent
        #/ The Host Agent SHALL publish the address and port of each
        #/ enabled Host Service on the guest bridge gateway, under the names
        #/ `buildkit`, `go_proxy`, `registry_mirror` and `http_cache`, as the
        #/ annotations `host-service.gitlab-runner.flintlock.dev/<name>` on its Host's
        #/ Node.
        # `flr host-services` publishes where the enabled Host Services
        # listen on the Host's Node, for the Runner to read (KF-189), from
        # the configuration render.sh makes for this Host. It serves nothing
        # and reaches only the API server. Its user id, 10003, is none of the
        # Host Services' (HI-064). It is not the flr image's own, 65532,
        # because that is the Exec Agent's, the one user id the Host Image
        # admits to flintlockd (HI-070). The binary is mode 0555, so any
        # user id runs it.
        - name: host-services
          image: ghcr.io/phoban01/flintlock-runner/flr:dev
          args: [host-services, --host-services-config, /etc/flr/rendered/host-services.yaml]
          env:
            # The Host's Node, which it annotates, and which the admission
            # policy lets it annotate and no other.
            - name: FLINTLOCK_RUNNER_HOST_NODE
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            runAsUser: 10003
            runAsGroup: 10003
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: rendered
              mountPath: /etc/flr/rendered
              readOnly: true
            - name: host-services-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        # The ConfigMap of templates and scripts; the Host Service components
        # merge their own entries into it.
        - name: templates
          configMap:
            name: flintlock-host-agent-config
            defaultMode: 0444
        # What render.sh makes of them for this Host. Nothing secret.
        - name: rendered
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        # Host mount: the Host Image's derived settings, written by
        # flr-host-config at every boot. Read by render only, for the bridge
        # gateway address. A Host without it has not configured itself, and
        # the pod does not start.
        - name: host-env
          hostPath:
            path: /run/flr/host.env
            type: File
        # The API credentials of the host-services container, in place of
        # the automounted ones, which the pod turns off: the three sources
        # the kubelet projects for automountServiceAccountToken, at the same
        # path, so that client-go's in-cluster configuration finds them, but
        # in this container only. The token is the pod's bound
        # ServiceAccount token, whose user information names the node the
        # pod runs on, which the admission policy reads
        # (host-services-admission-policy.yaml). Mode 0444, so that the
        # container's user id reads it.
        - name: host-services-token
          projected:
            defaultMode: 0444
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3607
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
        # Host mount: the Host Service cache directory of HI-024 on the
        # Host's instance store, so the caches outlive the pod and a reboot
        # (KF-072). type Directory: the Host Image makes it, and a Host where
        # it is missing does not get a fresh directory on its root volume.
        - name: cache
          hostPath:
            path: /var/lib/flintlock-runner/cache
            type: Directory
