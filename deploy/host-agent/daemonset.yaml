# The Host Agent (docs/requirements/12-cluster-fleet.md, section "Host
# Agent"): one pod per Host with the Pod Provider and the Host Services.
#
#= docs/requirements/12-cluster-fleet.md#cluster-host-agent
#/ The Fleet Manifests SHALL run the Host Agent as a DaemonSet that
#/ tolerates the Host taint, selects the Host label and contains the Pod
#/ Provider and the Host Services of FL-100.
#
# This file is the Pod Provider and the plumbing every Host Service shares.
# Each Host Service is a kustomize Component under services/, which adds its
# containers, its configuration templates and its entry in the Pod Provider's
# configuration; deploy/kustomization.yaml includes all four.
#
# Least privilege (KF-113). Nothing here is privileged, and no container
# adds a capability except the two noted where they are added: CAP_CHOWN
# for the cache preparation and CAP_SETUID/CAP_SETGID for rootless
# buildkitd. The host mounts are, each justified where it is declared:
#
#   /run/flr/host.env                    read-only, render only
#   /run/flr/not-ready.d                 read-only, Pod Provider only
#   /var/lib/flintlock-runner/cache      read-write, cache preparation and
#                                        the Host Services, each its own
#                                        subdirectory
#
# The Host Image labels all three for the container domain (HI-065): the
# first two container_ro_file_t, the cache container_file_t, at s0.
#
# flintlockd is reached on its loopback endpoint through the Host's network
# namespace, which takes no mount and no capability.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: flintlock-host-agent
  namespace: flintlock-system
  labels:
    app.kubernetes.io/name: flintlock-host-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: flintlock-host-agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flintlock-host-agent
    spec:
      # rbac.yaml and admission-policy.yaml name this account in this
      # namespace; keep both.
      serviceAccountName: flintlock-host-agent
      # The token goes to the Pod Provider only, through the projected
      # volume provider-token below.
      automountServiceAccountToken: false
      nodeSelector:
        gitlab-runner.flintlock.dev/host: "true"
      tolerations:
        - key: gitlab-runner.flintlock.dev/host
          operator: Equal
          value: "true"
          effect: NoSchedule
      #= docs/requirements/12-cluster-fleet.md#cluster-host-agent
      #/ The Host Agent SHALL run in the Host's network namespace and
      #/ SHALL bind every Host Service only to the guest bridge gateway address.
      # The Host's network namespace is where the guest bridge and its
      # gateway address are, and where flintlockd's loopback endpoint is
      # (HI-042). Each service's configuration names the gateway address,
      # which render.sh reads from the Host Image's /run/flr/host.env.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      hostPID: false
      hostIPC: false
      # KF-029: stopping the Pod Provider leaves every MicroVM alone, so
      # there is nothing to wait for beyond the services' own shutdown.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        # SELinux (HI-065). The containers keep the ordinary container
        # domain, container_t; only the MCS level is fixed. A pod otherwise
        # gets two random categories each time it starts, and what the Host
        # Services write into the cache directory carries them, so the next
        # Host Agent pod, with other categories, could neither read its
        # predecessor's caches nor hand them over in prepare-cache. With a
        # fixed pair every Host Agent pod reads what the last one wrote,
        # and a pod with random categories still cannot. The Host Image
        # labels the host paths below at s0, which every level dominates;
        # see "SELinux" in image/README.md.
        seLinuxOptions:
          level: "s0:c311,c827"
      initContainers:
        # Renders the Pod Provider's and the Host Services' configuration for
        # this Host, bridge gateway address included (render.sh).
        - name: render
          image: busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
          command: [/bin/sh, /etc/flr/templates/render.sh]
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: templates
              mountPath: /etc/flr/templates
              readOnly: true
            - name: rendered
              mountPath: /etc/flr/rendered
            - name: host-env
              mountPath: /run/flr/host.env
              readOnly: true
        #= docs/requirements/12-cluster-fleet.md#cluster-host-agent
        #/ The Host Agent SHALL keep all Host Service storage in the Host
        #/ Service cache directory of HI-024, so that it outlives the pod and a
        #/ reboot of the Host.
        # Creates each enabled Host Service's directory under the cache
        # directory and hands it to that service's user id
        # (prepare-cache.sh).
        - name: prepare-cache
          image: busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
          command: [/bin/sh, /etc/flr/templates/prepare-cache.sh]
          #= docs/requirements/12-cluster-fleet.md#cluster-least-privilege
          #/ The Host Agent SHALL hold only the privileges it needs to bind
          #/ to the bridge gateway, to write the cache directory and to reach the
          #/ local `flintlockd` endpoint.
          # Root, because root owns the Host Image's cache directory, and
          # CAP_CHOWN alone, to give each service its directory. A hostPath
          # is never re-owned by the kubelet, and fsGroup does not apply to
          # it, so nothing short of this lets the non-root services write
          # there.
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [CHOWN]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: templates
              mountPath: /etc/flr/templates
              readOnly: true
            - name: cache
              mountPath: /var/lib/flintlock-runner/cache
      containers:
        # The Pod Provider, `flr kubelet` (KF-010 to KF-032).
        - name: pod-provider
          image: ghcr.io/phoban01/flintlock-runner/flr:dev
          args: [kubelet, --kubelet-config, /etc/flr/rendered/kubelet.yaml]
          env:
            # KF-010: the Virtual Node is named after the Host's Node.
            - name: FLINTLOCK_RUNNER_HOST_NODE
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: kubelet-api
              containerPort: 10260
              protocol: TCP
          #= docs/requirements/12-cluster-fleet.md#cluster-hardening
          #/ The Fleet Manifests SHALL run the Pod Provider's container as
          #/ the user id that HI-063 admits to the local `flintlockd` endpoint, and
          #/ SHALL run no other container of the Host Agent as that user id.
          # The user id is POD_PROVIDER_UID of the Host Image, 10250 by
          # default, written here by kustomize from pod-provider-uid.yaml;
          # change it there, never here. It is set on this container only:
          # the pod sets no user id, and every other container names its
          # own, none of them this one. The files the Pod Provider reads, its
          # token and its serving certificate, are mounted with mode 0444 so
          # that this id can read them.
          securityContext:
            runAsNonRoot: true
            runAsUser: 10250
            runAsGroup: 10250
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: rendered
              mountPath: /etc/flr/rendered
              readOnly: true
            # KF-016: the Host Image's units write their not-ready reasons
            # here; the Pod Provider only reads them.
            - name: not-ready
              mountPath: /run/flr/not-ready.d
              readOnly: true
            - name: provider-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            - name: serving-tls
              mountPath: /etc/flr/serving
              readOnly: true
            - name: kubelet-client-ca
              mountPath: /etc/flr/kubelet-client-ca
              readOnly: true
            # The flr image is scratch and has no /tmp.
            - name: pod-provider-tmp
              mountPath: /tmp
      volumes:
        - name: pod-provider-tmp
          emptyDir: {}
        # The ConfigMap of templates and scripts; the Host Service components
        # merge their own entries into it.
        - name: templates
          configMap:
            name: flintlock-host-agent-config
            defaultMode: 0444
        # What render.sh makes of them for this Host. Nothing secret.
        - name: rendered
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        # Host mount: the Host Image's derived settings, written by
        # flr-host-config at every boot. Read by render only, for the bridge
        # gateway address and the Host reserve. A Host without it has not
        # configured itself, and the pod does not start.
        - name: host-env
          hostPath:
            path: /run/flr/host.env
            type: File
        # Host mount: the not-ready reasons of the Host Image (KF-016),
        # read-only, Pod Provider only.
        - name: not-ready
          hostPath:
            path: /run/flr/not-ready.d
            type: Directory
        # Host mount: the Host Service cache directory of HI-024 on the
        # Host's instance store, so the caches outlive the pod and a reboot
        # (KF-072). type Directory: the Host Image makes it, and a Host where
        # it is missing does not get a fresh directory on its root volume.
        - name: cache
          hostPath:
            path: /var/lib/flintlock-runner/cache
            type: Directory
        # The Pod Provider's API credentials, in place of the automounted
        # ones: the same three sources the kubelet projects for
        # automountServiceAccountToken, mounted at the same path, so that
        # client-go's in-cluster configuration finds them, but into the Pod
        # Provider's container only. The token is the pod's bound
        # ServiceAccount token, whose user information names the node the
        # pod runs on (KF-134); the Pod Provider checks that at start.
        - name: provider-token
          projected:
            defaultMode: 0444
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3607
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
        # KF-031: the kubelet API's serving certificate and key. The operator
        # provides this Secret; see deploy/README.md, "The Pod Provider's
        # serving certificate". The pod does not start without it.
        - name: serving-tls
          secret:
            secretName: flintlock-pod-provider-serving
            defaultMode: 0444
        # KF-031: the cluster's kubelet client certificate authority. On a
        # kubeadm cluster this is the cluster CA, which every namespace gets
        # as kube-root-ca.crt; patch this volume where the API server's
        # kubelet client certificate is issued by another CA.
        - name: kubelet-client-ca
          configMap:
            name: kube-root-ca.crt
            items:
              - key: ca.crt
                path: ca.crt
