# The Host Agent (docs/requirements/12-cluster-fleet.md, section "Host
# Agent"): one pod per Host with the Host Services, and the host-services
# container that publishes where they listen.
#
#= docs/requirements/12-cluster-fleet.md#cluster-host-agent
#/ The Fleet Manifests SHALL run the Host Agent as a DaemonSet that
#/ tolerates the Host taint, selects the Host label and contains the Host
#/ Services of FL-100.
#
# The Host label and the Host taint are battery-operator's: its Host Image
# and its Cluster API templates register every Host with the label
# battery.liquidmetal-x.dev/host=true and the taint
# battery.liquidmetal-x.dev/host=true:NoSchedule (its HI-074, HP-020 and
# HP-021).
#
# The Exec Agent is not in the Host Agent: battery-operator's Manifests run
# it, as a DaemonSet of their own (deploy/README.md, "The Exec Agent").
#
# This file is the plumbing every container of the Host Agent shares, and
# the host-services container. Each Host Service is a kustomize Component
# under services/, which adds its containers, its configuration templates
# and its entry in the host-services configuration;
# deploy/kustomization.yaml includes all four.
#
# Least privilege (KF-113). Nothing here is privileged, and no container
# adds a capability except the two noted where they are added: CAP_CHOWN
# for the cache preparation and CAP_SETUID/CAP_SETGID for rootless
# buildkitd. The one host mount is /run/battery/host.env, read-only, for
# the render init container. battery-operator's Host Image labels it
# container_ro_file_t at s0, so that a container may read it (its HI-065).
# The Host Service cache is an emptyDir of the pod (KF-197), which the
# kubelet labels for the pod itself.
#
# No container of the Host Agent reaches flintlockd.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: flintlock-host-agent
  namespace: flintlock-system
  labels:
    app.kubernetes.io/name: flintlock-host-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: flintlock-host-agent
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flintlock-host-agent
    spec:
      # host-services-rbac.yaml and host-services-admission-policy.yaml name
      # this account in this namespace; keep both.
      serviceAccountName: flintlock-host-agent
      # The token goes to the host-services container only, through its
      # projected volume host-services-token.
      automountServiceAccountToken: false
      nodeSelector:
        battery.liquidmetal-x.dev/host: "true"
      tolerations:
        - key: battery.liquidmetal-x.dev/host
          operator: Equal
          value: "true"
          effect: NoSchedule
      #= docs/requirements/12-cluster-fleet.md#cluster-host-agent
      #/ The Host Agent SHALL run in the Host's network namespace and
      #/ SHALL bind every Host Service only to the guest bridge gateway address.
      # The Host's network namespace is where the guest bridge and its
      # gateway address are. Each service's configuration names the gateway
      # address, which render.sh reads from BATTERY_GATEWAY in the Host
      # Image's /run/battery/host.env.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      hostPID: false
      hostIPC: false
      # Nothing to wait for beyond the services' own shutdown.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        # SELinux. battery-operator's Host Image runs every unprivileged
        # container confined (its HI-066). The containers keep the ordinary
        # container domain, container_t, except buildkitd, which names
        # container_engine_t and repeats this level (KF-139, in
        # services/buildkit); only the MCS level is fixed here. The kubelet
        # labels the cache emptyDir with the pod's level, and a container
        # that names a type but no level gets random categories of its own,
        # which could not use the cache. With one fixed level for the pod,
        # every container, buildkitd included, uses the cache.
        seLinuxOptions:
          level: "s0:c311,c827"
      initContainers:
        #= docs/requirements/12-cluster-fleet.md#cluster-host-agent
        #/ If the Host's gateway service ports or gateway service user ids
        #/ leave out any that the Fleet Manifests provide, then the Host Agent
        #/ SHALL NOT start the Host Services.
        # Renders the host-services container's and the Host Services'
        # configuration for this Host, bridge gateway address included
        # (render.sh). It first compares BATTERY_GATEWAY_SERVICE_PORTS and
        # BATTERY_GATEWAY_SERVICE_UIDS of host.env with host-pool.conf, and
        # fails when the Host leaves one out: the Host Image would then
        # drop a Host Service's port for guests, or let a Host Service's user
        # id reach the metadata service and the Host's control ports. An init
        # container that fails keeps every container of the pod from
        # starting.
        - name: render
          image: busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
          command: [/bin/sh, /etc/flr/templates/render.sh]
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: templates
              mountPath: /etc/flr/templates
              readOnly: true
            - name: rendered
              mountPath: /etc/flr/rendered
            - name: host-env
              mountPath: /run/battery/host.env
              readOnly: true
        # Creates each enabled Host Service's directory in the cache volume
        # and hands it to that service's user id (prepare-cache.sh).
        - name: prepare-cache
          image: busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
          command: [/bin/sh, /etc/flr/templates/prepare-cache.sh]
          #= docs/requirements/12-cluster-fleet.md#cluster-least-privilege
          #/ The Host Agent SHALL hold only the privileges it needs to bind
          #/ to the bridge gateway in the Host's network namespace and to write the
          #/ cache directory.
          # Root, because root owns the root of the cache volume, and
          # CAP_CHOWN alone, to give each service its directory. The Host
          # Services run as different user ids, and fsGroup would give every
          # one of them the others' directories, so nothing short of this
          # gives each non-root service a directory of its own.
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [CHOWN]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: templates
              mountPath: /etc/flr/templates
              readOnly: true
            - name: cache
              mountPath: /var/lib/flintlock-runner/cache
      # The Host Service Components add their containers to this one.
      containers:
        #= docs/requirements/12-cluster-fleet.md#cluster-host-agent
        #/ The Host Agent SHALL publish the address and port of each
        #/ enabled Host Service on the guest bridge gateway, under the names
        #/ `buildkit`, `go_proxy`, `registry_mirror` and `http_cache`, as the
        #/ annotations `host-service.gitlab-runner.flintlock.dev/<name>` on its Host's
        #/ Node.
        # `flr host-services` publishes where the enabled Host Services
        # listen on the Host's Node, for the Runner to read (KF-189), from
        # the configuration render.sh makes for this Host. It serves nothing
        # and reaches only the API server. Its user id, 10003, is none of the
        # Host Services' gateway service user ids (host-pool.conf). It is not
        # the flr image's own, 65532, because that is the Exec Agent's, the
        # one user id the Host Image admits to flintlockd (battery-operator
        # HI-070). The binary is mode 0555, so any user id runs it.
        - name: host-services
          image: ghcr.io/phoban01/flintlock-runner/flr:dev
          args: [host-services, --host-services-config, /etc/flr/rendered/host-services.yaml]
          env:
            # The Host's Node, which it annotates, and which the admission
            # policy lets it annotate and no other.
            - name: FLINTLOCK_RUNNER_HOST_NODE
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            runAsUser: 10003
            runAsGroup: 10003
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: rendered
              mountPath: /etc/flr/rendered
              readOnly: true
            - name: host-services-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        # The ConfigMap of templates and scripts; the Host Service components
        # merge their own entries into it.
        - name: templates
          configMap:
            name: flintlock-host-agent-config
            defaultMode: 0444
        # What render.sh makes of them for this Host. Nothing secret.
        - name: rendered
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        # Host mount: the Host Image's derived settings, written by
        # battery-host-config at every boot. Read by render only, for the
        # bridge gateway address and the gateway service ports and user ids.
        # A Host without it has not configured itself, and the pod does not
        # start.
        - name: host-env
          hostPath:
            path: /run/battery/host.env
            type: File
        # The API credentials of the host-services container, in place of
        # the automounted ones, which the pod turns off: the three sources
        # the kubelet projects for automountServiceAccountToken, at the same
        # path, so that client-go's in-cluster configuration finds them, but
        # in this container only. The token is the pod's bound
        # ServiceAccount token, whose user information names the node the
        # pod runs on, which the admission policy reads
        # (host-services-admission-policy.yaml). Mode 0444, so that the
        # container's user id reads it.
        - name: host-services-token
          projected:
            defaultMode: 0444
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3607
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
        #= docs/requirements/12-cluster-fleet.md#cluster-host-agent
        #/ The Host Agent SHALL keep all Host Service storage in one
        #/ `emptyDir` volume of its pod, on the Node's disk rather than in
        #/ memory.
        # The Host Service cache. It lives as long as the pod: a container
        # that restarts keeps it, and a new pod, after a rollout or an
        # eviction, starts with an empty cache. It is on the Node's disk, in
        # the kubelet's directory under /var, and counts against the Node's
        # ephemeral storage. buildkitd keeps its use under its garbage
        # collection limit, and the HTTP cache under the size of each
        # upstream; zot and Athens have no size limit. deploy/README.md,
        # "The Host Service cache", says why this is not a hostPath.
        - name: cache
          emptyDir: {}
