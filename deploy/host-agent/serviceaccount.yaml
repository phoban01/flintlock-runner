# The Host Agent's identity, which its host-services container
# authenticates as. host-services-rbac.yaml binds its permissions to it and
# host-services-admission-policy.yaml matches it by this name and namespace;
# keep all three.
#
#= docs/requirements/12-cluster-fleet.md#cluster-least-privilege
#/ The Fleet Manifests SHALL NOT grant any workload an AWS
#/ permission.
# No workload identity annotation: the Host Agent reaches nothing in AWS.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flintlock-host-agent
  namespace: flintlock-system
  labels:
    app.kubernetes.io/name: flintlock-host-agent
# The token is projected into the host-services container only
# (daemonset.yaml); no other container gets one.
automountServiceAccountToken: false
