# The Host Agent's identity, which the Exec Agent authenticates as.
# deploy/agent/rbac.yaml binds the Exec Agent's permissions to it and
# deploy/agent/admission-policy.yaml matches it by this name and namespace;
# keep all three.
#
#= docs/requirements/12-cluster-fleet.md#cluster-least-privilege
#/ The Fleet Manifests SHALL NOT grant any workload an AWS
#/ permission.
# No workload identity annotation: the Host Agent reaches nothing in AWS.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flintlock-host-agent
  namespace: flintlock-system
  labels:
    app.kubernetes.io/name: flintlock-host-agent
# The token is projected into the Exec Agent's container only
# (deploy/agent/host-agent-patch.yaml); no other container gets one.
automountServiceAccountToken: false
