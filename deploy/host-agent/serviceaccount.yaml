# The Host Agent's identity. deploy/host-agent/rbac.yaml binds the Pod
# Provider's permissions to it.
#
#= docs/requirements/12-cluster-fleet.md#cluster-least-privilege
#/ The Fleet Manifests SHALL NOT grant any workload an AWS
#/ permission.
# No workload identity annotation: the Host Agent reaches nothing in AWS.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flintlock-host-agent
  namespace: flintlock-system
  labels:
    app.kubernetes.io/name: flintlock-host-agent
# The token is projected into the Pod Provider's container only
# (deploy/host-agent/daemonset.yaml); no other container gets one.
automountServiceAccountToken: false
