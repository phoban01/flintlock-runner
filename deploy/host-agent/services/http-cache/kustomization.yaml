# The HTTP cache Host Service (FL-106), as a Component of the Host Agent:
# nginx, which is what push provisioning runs. Leaving this Component out of
# deploy/kustomization.yaml removes the container, its configuration and the
# Exec Agent's entry together (KF-075).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - path: daemonset-patch.yaml

configMapGenerator:
  - name: flintlock-host-agent-config
    namespace: flintlock-system
    behavior: merge
    files:
      - nginx-http-cache.conf.tmpl
      - http-cache.upstreams
      - agent.host-service.http_cache.yaml
      - cache-dirs.http-cache
