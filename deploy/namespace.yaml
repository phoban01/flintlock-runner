# The namespace of the Host Agent and the Runner. The name is repeated in
# every namespaced object rather than set by a kustomize `namespace:`
# transformer, because deploy/host-agent's RBAC and admission policy, which
# internal/hostservices' tests load unchanged, name it themselves.
apiVersion: v1
kind: Namespace
metadata:
  name: flintlock-system
  labels:
    app.kubernetes.io/part-of: flintlock-runner
